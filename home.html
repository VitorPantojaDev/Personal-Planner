<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Bem-vindo(a)!</h1>
    <p id="email-usuario"></p>

    <hr>

    <h2>Agenda</h2>

    <nav id="menu-principal">
        <span>Agenda</span>
        <a href="estudos.html">Estudos</a>
        <a href="contatos.html">Contatos</a>
    </nav>

    <div id="controles-agenda">
        <div id="seletor-visao">
            <button type="button" class="btn-visao" data-visao="dia">Dia</button>
            <button type="button" class="btn-visao" data-visao="semana">Semana</button>
            <button type="button" class="btn-visao" data-visao="mes">Mês</button>
        </div>

        <div id="navegacao-data">
            <button type="button" id="btn-anterior" aria-label="Período anterior">&lsaquo;</button>
            <span id="rotulo-data"></span>
            <button type="button" id="btn-proximo" aria-label="Próximo período">&rsaquo;</button>
            <button type="button" id="btn-hoje">Hoje</button>
        </div>
    </div>

    <div id="agenda-container">
        Carregando compromissos...
    </div>

    <br>

    <button id="btn-novo-compromisso">
        Novo compromisso
    </button>

    <div id="formulario-compromisso" style="display:none;">
        <h3 id="form-titulo">Novo compromisso</h3>

        <form id="form-compromisso">
            <input type="hidden" id="compromisso-id">

            <div>
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" required>
            </div>

            <div>
                <label for="descricao">Descrição:</label>
                <textarea id="descricao"></textarea>
            </div>

            <div>
                <label for="data">Data:</label>
                <input type="date" id="data" required>
            </div>

            <div>
                <label for="hora_inicio">Hora início:</label>
                <input type="time" id="hora_inicio">
            </div>

            <div>
                <label for="hora_fim">Hora fim:</label>
                <input type="time" id="hora_fim">
            </div>

            <div>
                <label for="categoria">Categoria:</label>
                <input type="text" id="categoria" placeholder="pessoal, faculdade, trabalho...">
            </div>

            <div id="compromisso-contato-linha">
                <label for="compromisso-contato">Vincular a um contato (opcional):</label>
                <select id="compromisso-contato">
                    <option value="">Nenhum</option>
                </select>
            </div>

            <button type="submit" id="btn-salvar-compromisso">Salvar</button>
            <button type="button" id="btn-cancelar-compromisso">Cancelar</button>
        </form>

        <p id="mensagem-erro-form" style="color: red;"></p>
    </div>

    <hr>
 
    <button id="btn-sair">Sair</button>
 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
