<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#173625">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>📜 Estudos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@500;600;700&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Estudos</h1>
    <p id="email-usuario"></p>

    <nav id="menu-principal">
        <a href="home.html">Agenda</a>
        <span>Estudos</span>
        <a href="contatos.html">Contatos</a>
    </nav>

    <hr>

    <div id="cronometro-estudos">
        <button type="button" id="btn-toggle-cronometro">⏱ Cronômetro de Estudos <span id="cronometro-mini"></span></button>
        
        <div id="cronometro-conteudo" class="oculto">
            <div id="cronometro-config">
            <label for="cronometro-minutos">Minutos:</label>
            <input type="number" id="cronometro-minutos" min="1" value="25">
        </div>

        <div id="cronometro-display">25:00</div>
        <div id="cronometro-status"></div>

        <div id="cronometro-botoes">
            <button type="button" id="btn-cronometro-iniciar">Iniciar</button>
            <button type="button" id="btn-cronometro-pausar" disabled>Pausar</button>
            <button type="button" id="btn-cronometro-zerar">Zerar</button>
        </div>
        </div>
    </div>

    <hr>

    <input type="text" id="pesquisa-cursos" placeholder="Pesquisar curso...">
    
    <div id="lista-cursos">Carregando cursos...</div>

    <br>

    <button id="btn-novo-curso">Novo curso</button>

    <div id="formulario-curso" style="display:none;">
        <h3 id="form-curso-titulo">Novo curso</h3>

        <form id="form-curso">
            <input type="hidden" id="curso-id">

            <div>
                <label for="curso-nome">Nome:</label>
                <input type="text" id="curso-nome" required>
            </div>

            <div>
                <label for="curso-carga-total">Carga horária total (horas):</label>
                <input type="number" id="curso-carga-total" min="0" step="0.5" required>
            </div>

            <div>
                <label for="curso-data-limite">Data limite:</label>
                <input type="date" id="curso-data-limite">
            </div>

            <div>
                <label for="curso-link">Link (curso online, material, etc.):</label>
                <input type="url" id="curso-link" placeholder="https://...">
            </div>

            <div>
                <label for="curso-observacoes">Observações:</label>
                <textarea id="curso-observacoes" rows="3"></textarea>
            </div>

            <button type="submit">Salvar</button>
            <button type="button" id="btn-cancelar-curso">Cancelar</button>
        </form>

        <p id="mensagem-erro-curso" style="color: red;"></p>
    </div>

    <div id="formulario-sessao" style="display:none;">
        <h3>Registrar sessão de estudo</h3>

        <form id="form-sessao">
            <input type="hidden" id="sessao-curso-id">

            <div>
                <label for="sessao-horas">Horas estudadas:</label>
                <input type="number" id="sessao-horas" min="0.1" step="0.1" required>
            </div>

            <div>
                <label for="sessao-data">Data:</label>
                <input type="date" id="sessao-data" required>
            </div>

            <div>
                <label for="sessao-observacao">Observação:</label>
                <input type="text" id="sessao-observacao">
            </div>

            <button type="submit">Registrar</button>
            <button type="button" id="btn-cancelar-sessao">Cancelar</button>
        </form>

        <p id="mensagem-erro-sessao" style="color: red;"></p>
    </div>

    <hr>

    <button id="btn-sair">Sair</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/estudos.js"></script>
</body>
</html>
