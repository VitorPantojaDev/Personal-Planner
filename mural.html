<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#173625">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <title>Mural de Recados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Recados</h1>
    <p id="email-usuario"></p>

    <nav id="menu-principal">
        <a href="home.html">Voltar para Agenda</a>
        
    </nav>

    <hr>

    <input type="text" id="pesquisa-recados" placeholder="Recados, sugestões, avisos..">

    <div id="lista-recados">Carregando recados...</div>

    <button type="button" id="btn-novo-recado">Novo recado</button>

    <div id="editor-recado" class="oculto">
        <input type="hidden" id="recado-id">

        <input type="text" id="recado-titulo" placeholder="Título">
        <textarea id="recado-conteudo" rows="12" placeholder="Escreva aqui..."></textarea>

        <div id="recado-info"></div>

        <div id="recado-botoes">
            <button type="button" id="btn-salvar-recado">Salvar</button>
            <button type="button" id="btn-fechar-recado">Fechar</button>
            <button type="button" id="btn-excluir-recado" class="oculto">Excluir</button>
        </div>

        <p id="mensagem-erro-recado" style="color: red;"></p>
    </div>

    <hr>
    <hr>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/mural.js"></script>
</body>
</html>
